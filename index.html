<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>HandyDice</title>
<meta name="description" content="Free dice roller: D6 with pips, D4–D100, trays to collect dice. Offline, no sign-up, no trackers.">
<meta name="theme-color" content="#12141a">
<link rel="manifest" href="manifest.en.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HandyDice">
<link rel="stylesheet" href="style.css">
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem('handydice-theme') || 'auto';
  document.documentElement.dataset.surface = JSON.parse(localStorage.getItem('handydice-state'))?.surface || '';
} catch {}
if ('serviceWorker' in navigator) {
  if (navigator.serviceWorker.controller) {
    let waited = 0;
    const apply = () => {
      if (waited < 30000 && (document.body?.classList.contains('rolling') || document.querySelector('dialog[open]'))) {
        waited += 500;
        setTimeout(apply, 500);
      } else location.reload();
    };
    navigator.serviceWorker.addEventListener('controllerchange', apply, { once: true });
  }
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.warn));
}
</script>
</head>
<body>
<div id="main"></div>
<noscript>HandyDice requires JavaScript and WebAssembly.</noscript>
<script type="module">
import init from './pkg/handydice.js';
try { await init(); }
catch (error) {
  console.error(error);
  const message = document.createElement('p');
  message.setAttribute('role', 'alert');
  message.textContent = 'HandyDice could not start. Reload the app and try again. ' + error.message;
  document.getElementById('main').replaceChildren(message);
}
</script>
</body>
</html>
