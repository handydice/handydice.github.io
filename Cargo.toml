[package]
name = "handydice"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.3", default-features = false, features = ["minimal", "web", "mounted", "document"] }
wgpu = { version = "26", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions", "TextMetrics", "CanvasGradient",
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "ImageData", "HtmlDialogElement", "HtmlInputElement", "HtmlSelectElement", "HtmlMetaElement", "HtmlLinkElement", "Node", "NodeList", "DomRect", "DomTokenList", "CssStyleDeclaration", "Storage", "Navigator", "Performance", "MediaQueryList", "MediaQueryListEvent", "Event", "EventTarget", "PointerEvent", "MouseEvent", "KeyboardEvent", "FocusEvent", "DeviceOrientationEvent", "DeviceMotionEvent", "DeviceAcceleration", "Screen", "ScreenOrientation", "OrientationType", "VisualViewport", "Response", "Request", "AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode", "ServiceWorkerContainer", "ServiceWorkerRegistration", "ServiceWorker", "Location", "UrlSearchParams", "console"
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-reference-types"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
